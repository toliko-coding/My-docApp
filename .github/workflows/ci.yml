name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        # react-native@0.86.2 pins @react-native/jest-preset to exactly
        # 0.86.2 as an optional peer, while jest-expo@57.0.5 (the latest
        # release) wants ^0.86.3 — an unresolved upstream mismatch between
        # the two packages at their current SDK 57 patch versions, not
        # something fixable by picking a different version on our end.
        run: npm ci --legacy-peer-deps

      - name: Generate expo-env.d.ts
        # Normally created the first time `expo start`/`expo prebuild` runs
        # locally, then left out of git on purpose (see the file's own
        # comment) since every dev environment regenerates it. CI never
        # starts the dev server, so without this, typecheck fails on a
        # fresh checkout — it references expo/types, which is what declares
        # the ambient *.css / *.module.css module types the app relies on
        # (global.css, animated-icon.module.css). Content is fixed and
        # identical for every Expo project; it's not something to compute.
        run: echo '/// <reference types="expo/types" />' > expo-env.d.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
